# Постоянные значения выпуска Mostik — одно место для release.sh, publish-release.sh и тестов.
# Читается как shell (KEY=value, без подстановок) и как текст из Python и Swift-тестов.
#
# MOSTIK_FEED_URL — адрес ленты Sparkle (SUFeedURL). После выпуска 0.1.0 НЕ МЕНЯЕТСЯ НИКОГДА:
# установленные копии знают только его. Переезд на свой домен — перенаправлением со старого адреса.
MOSTIK_FEED_URL=https://tonyprots.github.io/mostik/appcast.xml
# Репозиторий GitHub: Releases с .dmg и ветка gh-pages с лентой.
MOSTIK_GITHUB_REPO=tonyprots/mostik
# Самоподписанный сертификат подписи кода (docs/release.md, «Сертификат „Mostik Release“»).
# SHA-1 закрепляет именно этот сертификат: требование подписи приложения —
#   identifier "app.mostik.mac" and certificate leaf = H"<SHA-1>"
# и разрешения macOS держатся за него. Новый сертификат = все установленные копии теряют разрешения.
MOSTIK_SIGN_CERT_NAME="Mostik Release"
MOSTIK_SIGN_CERT_SHA1=BB63A4C6A7B9AF545DD12FAEEBD7B979DBD7C864
