# CI Mostik: сборка Swift, тесты ядра (MostikCoreTests: логика, страж локализации,
# контраст палитры, подписи VoiceOver) и быстрые тесты Python-движка.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift — сборка и MostikCoreTests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Раннер собирает с Xcode, а README обещает сборку на одних Command Line Tools: путь «без Xcode»
      # CI не проверяет, его проверяют локально.
      - name: Xcode (последний стабильный)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Версия Swift
        run: swift --version
      - name: Сборка
        run: swift build
      - name: MostikCoreTests
        # Тесты сами читают исходники (страж локализации и доступности, палитра):
        # запускать из корня репозитория.
        run: swift run MostikCoreTests

  denylist:
    name: Запрещённые строки — файлы и история
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # история целиком: строка, удалённая из файла, остаётся в старых коммитах
      - name: scripts/check-denylist.sh
        # Список — только в секрете: в репозитории он сам был бы утечкой. Без секрета (PR из форка) —
        # предупреждение, а не провал. Печатаются только файл:строка и хеши коммитов.
        env:
          MOSTIK_DENYLIST: ${{ secrets.MOSTIK_DENYLIST }}
        run: |
          bash scripts/check-denylist.sh --tracked --allow-missing
          bash scripts/check-denylist.sh --history --allow-missing

  engine:
    name: Движок — pytest (без медленных)
    runs-on: macos-latest
    timeout-minutes: 20
    # Код transcriber — копия в engine/vendor_transcriber (П10 С11): второй репозиторий не нужен.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: engine/requirements*.txt
      - name: Зависимости
        run: python -m pip install -r engine/requirements-test.txt
      - name: pytest -m "not slow"
        working-directory: engine
        run: python -m pytest -q -m "not slow"
